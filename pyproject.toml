[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "freshroute"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "scipy>=1.9", "pulp==4.0.0; python_version >= '3.12'",
  "pulp>=2.8,<4; python_version < '3.12'",  # D-22: pulp 4 needs 3.12; floor stays 3.10
  "highspy==1.15.1", "pandas==2.3.3", "numpy==2.2.1",
  "pydantic==2.10.4", "fastapi>=0.115", "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.15.15", "httpx>=0.27"]

[project.scripts]
freshroute = "freshroute.cli:main"

[tool.uv.build-backend]
module-root = "src"
module-name = "freshroute"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "validator", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
